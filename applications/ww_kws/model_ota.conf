#
# Application options for partition-resident models (model-only OTA).
#
# Enable model OTA via sysbuild: pass sysbuild_model_ota.conf as SB_EXTRA_CONF_FILE.
# CONFIG_APP_MODEL_OTA is set from SB_CONFIG_APP_MODEL_OTA in sysbuild.cmake.

CONFIG_MODEL_OTA_SMP_MAX_SLOTS=2

# Model partitions alias primary/secondary to the same flash, so uploads land on the
# primary slot (e.g. slot 2 for image 1). Device Manager CONFIRM_ONLY sends confirm
# by hash; MCUmgr denies that for non-active images unless this is enabled.
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_IMAGE_ANY=y
