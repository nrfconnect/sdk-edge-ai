# Enable observability
CONFIG_NRF_EDGEAI_OBSV=y

# Enable observability for both models in the default wakeword-gated mode
CONFIG_MODELS_OBSERVABILITY_WW=y
CONFIG_MODELS_OBSERVABILITY_KWS=y

# Resource sizing for KWS with 12 classes and WW with 2 synthetic classes.
CONFIG_NRF_EDGEAI_OBSV_MAX_CLASSES=12
CONFIG_NRF_EDGEAI_OBSV_MEMFAULT_MAX_CONTEXTS=2

# Model certainty descriptor, applied to both models.
CONFIG_NRF_EDGEAI_OBSV_METRIC_MODEL_CERTAINTY_DESC=y
CONFIG_NRF_EDGEAI_OBSV_MODEL_CERTAINTY_DESC_BIN_NUM=16

# Export observability counters as Memfault heartbeat metrics.
CONFIG_NRF_EDGEAI_OBSV_MEMFAULT=y

# Memfault settings
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_USER_CONFIG_ENABLE=y
CONFIG_MEMFAULT_NCS_IMPLEMENT_METRICS_COLLECTION=n
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="ww-kws-obsv"

# Bluetooth MDS
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WW KWS Obsv"
CONFIG_BT_PRIVACY=y
CONFIG_BT_MDS=y

CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Enable bonding
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
