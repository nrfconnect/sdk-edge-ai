# Models observability and its dependencies. Both models are observed by default
# (the default wakeword-gated mode runs both). Disable one to observe only the
# other; an option is also masked automatically if its model is not built.
CONFIG_MODELS_OBSERVABILITY_WW=y
CONFIG_MODELS_OBSERVABILITY_KWS=y
CONFIG_ZCBOR=y
CONFIG_NRF_EDGEAI_OBSV=y
CONFIG_NRF_EDGEAI_OBSV_ENCODE=y

# Observability memory sizing These values cover the default scope
# (both models): MAX_CLASSES is the largest observed class count (keyword model = 12,
# the wakeword model needs only its synthesized 2), MAX_CONTEXTS is one Memfault
# context per observed model. Use 2 / 1 for the wakeword model only, 12 / 1 for the
# keyword model only, and change MAX_CLASSES for a custom model.
CONFIG_NRF_EDGEAI_OBSV_MAX_CLASSES=12
CONFIG_NRF_EDGEAI_OBSV_MEMFAULT_MAX_CONTEXTS=2

# All built-in metrics, applied to both models (the wakeword model's single output
# is expanded to a synthetic 2-class distribution in wakeword.c). Histograms at 16
# bins to match the ww_kws_model_obsv reference.
CONFIG_NRF_EDGEAI_OBSV_METRIC_PROBS_DISTRIBUTION=y
CONFIG_NRF_EDGEAI_OBSV_PROBS_DISTRIBUTION_BIN_NUM=16
CONFIG_NRF_EDGEAI_OBSV_METRIC_TRANSITION_MATRIX=y
CONFIG_NRF_EDGEAI_OBSV_METRIC_PREDICTION_SWITCHING_RATE=y
CONFIG_NRF_EDGEAI_OBSV_METRIC_PROBS_ENTROPY_DIST=y
CONFIG_NRF_EDGEAI_OBSV_PROBS_ENTROPY_DIST_BIN_NUM=16
CONFIG_NRF_EDGEAI_OBSV_METRIC_PROBS_TOP2_MARGIN_DIST=y
CONFIG_NRF_EDGEAI_OBSV_PROBS_TOP2_MARGIN_DIST_BIN_NUM=16
CONFIG_NRF_EDGEAI_OBSV_METRIC_CLASS_STREAK_DIST=y
CONFIG_NRF_EDGEAI_OBSV_CLASS_STREAK_DIST_BIN_NUM=16
CONFIG_NRF_EDGEAI_OBSV_CLASS_STREAK_DIST_TOP=20
CONFIG_NRF_EDGEAI_OBSV_CLASS_STREAK_DIST_TOLERANCE=1
CONFIG_NRF_EDGEAI_OBSV_METRIC_MEL_ENERGY_DESC=y
CONFIG_NRF_EDGEAI_OBSV_MEL_ENERGY_DESC_BIN_NUM=16
CONFIG_NRF_EDGEAI_OBSV_MEL_ENERGY_DESC_MAX_FEATURES=40
CONFIG_NRF_EDGEAI_OBSV_MEL_ENERGY_DESC_SCALE_P01_MILLI=0
CONFIG_NRF_EDGEAI_OBSV_MEL_ENERGY_DESC_SCALE_P99_MILLI=16000
CONFIG_NRF_EDGEAI_OBSV_METRIC_MEL_SPECTRAL_DESC=y
CONFIG_NRF_EDGEAI_OBSV_MEL_SPECTRAL_DESC_BIN_NUM=16

CONFIG_NRF_EDGEAI_OBSV_MEMFAULT=y
CONFIG_NRF_EDGEAI_OBSV_MEMFAULT_AUTO_COLLECT=y

# System workqueue stack — a SHARED, global stack.
# This value covers the observability encode buffer for the
# default scope (both models = 2 contexts x 12 classes) plus headroom.
# Lower it to ~8192 for the keyword model only or ~4096 for the wakeword model only.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=12288

# Bluetooth MDS
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WW KWS Obsv"
CONFIG_BT_PRIVACY=y
CONFIG_BT_MDS=y

CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Enable bonding
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Memfault settings
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_USER_CONFIG_ENABLE=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="ww-kws-obsv"
