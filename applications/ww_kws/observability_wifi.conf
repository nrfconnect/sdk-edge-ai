# Wi-Fi transport for observability on the nRF7120 DK, uploading directly to
# Memfault over HTTPS. Use together with observability.conf:
#   -DEXTRA_CONF_FILE="observability.conf;observability_wifi.conf"
#   -DEXTRA_DTC_OVERLAY_FILE=observability_wifi.overlay
#
# The device connects to a Wi-Fi access point and the Memfault SDK posts its data
# (including the observability CDR) to the Memfault cloud. Only the Memfault
# project key (below) and the Wi-Fi credentials (shell, wifi cred add) are needed.
#
# Based on the nRF Connect SDK Memfault sample (samples/debug/memfault,
# prj.conf + boards/nrf7002dk_nrf5340_cpuapp.conf).

# Memfault project key, from Project -> Settings -> General in the Memfault app
CONFIG_MEMFAULT_PROJECT_KEY=""

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=40144
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=92856
# As in the Memfault sample
CONFIG_MAIN_STACK_SIZE=8192

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=30
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_ZVFS_POLL_MAX=8
CONFIG_POSIX_API=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=30000

# Connection manager: brings the Wi-Fi interface up and connects using stored credentials
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=6144

# Wi-Fi station
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=6144
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_WIFI_CREDENTIALS=y

# TLS for HTTPS to Memfault. The Memfault integration installs its root certificates
# at every boot, so they are kept in the default volatile TLS credentials backend.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_TLS_CREDENTIALS=y

# mbedTLS, as in the Memfault sample
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=81920

CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_CRYPT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_ALG_RSA_OAEP=y
CONFIG_PSA_WANT_RSA_KEY_SIZE_2048=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_GENERATE=y

CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# Not in the sample: the ECDHE-RSA key exchange used by the Memfault servers is only enabled
# by default when ECDH is available. Without it only PSK ciphersuites are offered and the
# handshake is closed by the server. The ephemeral ECDH key also needs the ECC key pair
# types, or the client key exchange fails with MBEDTLS_ERR_SSL_HW_ACCEL_FAILED.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# Memfault over HTTPS
CONFIG_MEMFAULT_HTTP_ENABLE=y
CONFIG_MEMFAULT_ROOT_CERT_STORAGE_TLS_CREDENTIAL_STORAGE=y
CONFIG_MEMFAULT_NCS_PROVISION_CERTIFICATES=y
# Memfault device ID from the SoC device ID (same value nRF Cloud would use)
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD_USE_DEDICATED_WORKQUEUE=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD_DEDICATED_WORKQUEUE_STACK_SIZE=8192
# Started by the application once the network is connected
CONFIG_MEMFAULT_PERIODIC_UPLOAD_ENABLED_DEFAULT=n
# Telemetry only: no Memfault OTA, and no Memfault shell (its OTA command needs it)
CONFIG_MEMFAULT_ZEPHYR_FOTA=n
CONFIG_MEMFAULT_SHELL=n
# Logs are not uploaded. Memfault log capture would also force CONFIG_LOG on in release builds.
CONFIG_MEMFAULT_LOGGING_ENABLE=n

# Persistent storage for Wi-Fi credentials
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Shell for provisioning Wi-Fi credentials.
# Also enabled on top of the release configuration, as provisioning needs it.
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
# The shell enables the interrupt-driven UART API, which takes UART21 away
# from the async API that the control output uses.
CONFIG_UART_21_INTERRUPT_DRIVEN=n
