# Memfault release-management OTA via nRF Connect Device Manager.
# Compose with observability.conf for MDS observability on the same BLE link.
# Replaces ble_mcumgr.conf when Memfault-managed app FOTA is required.

CONFIG_WW_KWS_MEMFAULT_FOTA=y

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WW KWS"
CONFIG_BT_PRIVACY=y

CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_BT_SETTINGS=y

CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# Device Information Service (required by Device Manager Memfault FOTA)
CONFIG_BT_DIS=y
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_SW_REV=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Align Memfault and DIS device serial with SoC unique ID
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y
# CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC is not set
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y

# Static firmware version from VERSION file (see Kconfig overrides)
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y

CONFIG_MEMFAULT_NCS_HW_VERSION="nrf54lm20dk-kws-fota"

# Set your project key in memfault_user.conf (see memfault_user.conf.example).
