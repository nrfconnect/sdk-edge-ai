sample:
  description: Wakeword and Keyword Spotting application
  name: ww kws

common:
  sysbuild: true
  build_only: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_ww_kws
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "Initialization completed"


tests:
  applications.ww_kws.zdebug:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp

  applications.ww_kws.zrelease:
    extra_args:
      - FILE_SUFFIX=release
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp

  applications.ww_kws.obsv_ble.zdebug:
    extra_args:
      - EXTRA_CONF_FILE="observability.conf;observability_ble.conf"
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp

  applications.ww_kws.obsv_ble.zrelease:
    extra_args:
      - FILE_SUFFIX=release
      - EXTRA_CONF_FILE="observability.conf;observability_ble.conf"
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp

  applications.ww_kws.obsv_wifi.zdebug:
    extra_args:
      - EXTRA_CONF_FILE="observability.conf;observability_wifi.conf"
      - EXTRA_DTC_OVERLAY_FILE="observability_wifi.overlay"
    platform_allow:
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf7120dk/nrf7120e/cpuapp

  applications.ww_kws.obsv_wifi.zrelease:
    extra_args:
      - FILE_SUFFIX=release
      - EXTRA_CONF_FILE="observability.conf;observability_wifi.conf"
      - EXTRA_DTC_OVERLAY_FILE="observability_wifi.overlay"
    platform_allow:
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf7120dk/nrf7120e/cpuapp
