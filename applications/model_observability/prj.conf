# nRF Edge AI
CONFIG_NRF_EDGEAI=y
# nRF Edge AI dependencies
CONFIG_FPU=y

# Enable sensor and LED
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_GPIO=y

# Enable logging and assert
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_ASSERT=y

# Bluetooth configuration. The service is selected with CONFIG_APP_BLE_NUS
# (default, sends the recognized class) or CONFIG_APP_BLE_MDS (see observability.conf)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF Edge AI Obsv"
