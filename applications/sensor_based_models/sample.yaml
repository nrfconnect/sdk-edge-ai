sample:
  description: Sensor based models application
  name: sensor based models

common:
  sysbuild: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_sensor_based_models
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "Booting MCUboot"
      - "I: Starting bootloader"
      - "I: Jumping to the first image slot"
      - "Booting nRF Connect SDK"
      - "nRF Edge AI Sensor Based Models Demo"
      - "nRF Edge AI Runtime Version:"
      - "nRF Edge AI Lab Solution id:"

tests:
  applications.sensor_based_models.default:
    build_only: true
    platform_allow:
      - nrf54l15tag/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15tag/nrf54l15/cpuapp
  applications.sensor_based_models.nus:
    build_only: true
    platform_allow:
      - nrf54l15tag/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15tag/nrf54l15/cpuapp
    extra_args:
      - CONFIG_BLE_NUS_OUTPUT=y
