sample:
  description: Human Activity Recognition application
  name: har

common:
  sysbuild: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_har
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "Booting MCUboot"
      - "I: Starting bootloader"
      - "I: Jumping to the first image slot"
      - "Booting nRF Connect SDK"
      - "nRF Edge AI Human Activity Recognition Demo"
      - "nRF Edge AI Runtime Version:"
      - "nRF Edge AI Lab Solution id:"

tests:
  applications.har.default:
    build_only: true
    platform_allow:
      - nrf54l15tag/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15tag/nrf54l15/cpuapp
  applications.har.nus:
    build_only: true
    platform_allow:
      - nrf54l15tag/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15tag/nrf54l15/cpuapp
    extra_args:
      - CONFIG_BLE_NUS_OUTPUT=y
