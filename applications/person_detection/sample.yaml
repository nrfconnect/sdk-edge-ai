sample:
  description: Person detection application
  name: person_detection

common:
  sysbuild: true
  build_only: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_person_detection
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "Person detection start"
      - "No detections|Bounding box"

tests:
  applications.person_detection.zdebug:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp

  applications.person_detection.power_measurement.zdebug:
    extra_args:
      - EXTRA_CONF_FILE="power_measurement.conf"
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
