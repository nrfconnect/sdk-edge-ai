# BLE SMP transport + Memfault MCUmgr group for gateway-driven model OTA.
# Include with EXTRA_CONF_FILE on top of prj.conf, for example:
#   west build ... -- -DEXTRA_CONF_FILE=prj_ble_memfault.conf

# Bluetooth LE peripheral for SMP (MCUmgr)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EdgeAI Regression"
# Use a static address so phones show a stable name while scanning.
CONFIG_BT_PRIVACY=n

# SMP characteristics must be readable without pairing for nRF Device Manager.
# (With BT_SMP=y the default is AUTHEN, which leaves SMP stuck on "initializing".)
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# SMP over BLE instead of the application UART (console logging stays on UART).
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

CONFIG_CRC=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Bonding persistence for repeat gateway connections
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_BT_SETTINGS=y

# Memfault device identity exposed to gateways via MCUmgr group 128
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_USER_CONFIG_ENABLE=n
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="edgeai-regression"
CONFIG_MEMFAULT_NCS_FW_TYPE="regression-model"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="1.0.0"
CONFIG_MEMFAULT_MCUMGR_GRP=y
CONFIG_MEMFAULT_NCS_HW_VERSION="nrf54lm20dk-ota-poc"

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
