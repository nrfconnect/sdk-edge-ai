#
# Partition-resident regression model (model-only OTA).
#
# CMake applies the model devicetree overlay and sysbuild_model_ota.conf automatically when
# model_ota.conf (or -DCONFIG_APP_MODEL_OTA=y) is used.

CONFIG_APP_MODEL_OTA=y
CONFIG_MODEL_OTA_SMP_MAX_SLOTS=1

CONFIG_BOOTLOADER_MCUBOOT=y

# Flash + CRC (required by MCUMGR image DFU and UART transport)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y

# FW and model DFU over SMP (UART)
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
