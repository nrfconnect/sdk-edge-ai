# nRF Edge AI
CONFIG_NRF_EDGEAI=y
# nRF Edge AI dependencies
CONFIG_FPU=y

# Model-only OTA update: by default (CONFIG_NRF_EDGEAI_REGRESSION_MODEL_OTA=y, see Kconfig)
# this sample loads the model from the model_storage flash partition instead of linking it
# into the application image. FLASH/FLASH_MAP/CRC/MODEL_OTA/MODEL_OTA_* are selected by that
# option together with the NRF_EDGEAI_REGRESSION_MODEL backend choice.

CONFIG_NCS_SAMPLES_DEFAULTS=y

# MCUboot dual-slot FW (image 0) + dual-slot model (image 1).
CONFIG_BOOTLOADER_MCUBOOT=y

# FW and model DFU over SMP (UART)
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
