# Configuration for scripts/ci/check_binary_files.py

# Path prefixes where new binary files with allowed extensions are permitted.
allowed_paths:
  # zephyr-keep-sorted-start
  - applications/
  - doc/
  - samples/
  # zephyr-keep-sorted-stop

# Extensions allowed for new binary files under allowed_paths.
allowed_extensions:
  - .jpg
  - .jpeg
  - .png
  - .svg
  - .webp
  - .gif

