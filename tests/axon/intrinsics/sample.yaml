sample:
  description: DSP intrinsics test to run and validate Axon NPU intrinsic functions
  name: nRF Edge AI Axon DSP Intrinsics test
tests:
  axon.intrinsics:
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "TEST:\\tAXON_INTRINSICS\\tCASE COUNT\\t(\\d+)"
        - "TEST:\\tAXON_INTRINSICS\\tCOMPLETE\\tPASS COUNT\\t(\\d+)\\tFAIL COUNT\\t(0)"
    sysbuild: true
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf7120dk/nrf7120/cpuapp
      - nrf9251dk/nrf9251/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
